# Credenciales del administrador de MinIO. PLANTILLA: no subas aquí las claves reales.
# La contraseña debe tener al menos 8 caracteres.
apiVersion: v1
kind: Secret
metadata:
  name: minio-secret
  namespace: storage
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: file-storage-service
type: Opaque
stringData:
  MINIO_ROOT_USER: cambia-este-usuario
  MINIO_ROOT_PASSWORD: cambia-esta-clave
