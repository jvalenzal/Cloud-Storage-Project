# Entorno completo de DESARROLLO local: PostgreSQL + MinIO + migraciones + API.
# Uso:
#   cp .env.example .env            # y cambia las credenciales
#   docker compose up -d --build    # levanta todo
#   docker compose up -d postgres minio   # sólo los servicios de apoyo (API con uvicorn en local)
#
# Docker Compose lee automáticamente el .env de este directorio. Dentro de la red de Compose
# la API usa los nombres de servicio (postgres, minio), así que DATABASE_URL y S3_ENDPOINT_URL
# del .env (pensados para ejecutar la API en el host) se sustituyen aquí.

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Falta POSTGRES_USER}:${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Falta POSTGRES_DB}
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:?Falta MINIO_ROOT_USER}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Falta MINIO_ROOT_PASSWORD}
  S3_BUCKET: ${S3_BUCKET:-files}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_AUTO_CREATE_BUCKET: ${S3_AUTO_CREATE_BUCKET:-true}
  MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-104857600}
  ALLOWED_CONTENT_TYPES: ${ALLOWED_CONTENT_TYPES:-}
  MAX_FILENAME_LENGTH: ${MAX_FILENAME_LENGTH:-255}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # MinIO dejó de publicar imágenes en Docker Hub/Quay; pgsty/minio es una build comunitaria
    # del mismo servidor (mismas variables y consola). Se puede cambiar con MINIO_IMAGE.
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"       # API S3
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # consola web
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Aplica las migraciones de Alembic y termina.
  migrate:
    build: .
    image: file-storage-service:dev
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    image: file-storage-service:dev
    restart: unless-stopped
    environment: *app-env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  miniodata:
