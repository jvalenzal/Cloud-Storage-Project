# Entorno completo de DESARROLLO local: MySQL + MinIO + migraciones + API.
# (El despliegue multinodo está en deploy/ y el de Kubernetes/k3s en k8s/.)
# Uso:
#   cp .env.example .env            # y cambia las credenciales
#   docker compose up -d --build    # levanta todo
#   docker compose up -d mysql minio   # sólo los servicios de apoyo (API con uvicorn en local)
#
# Docker Compose lee automáticamente el .env de este directorio. Dentro de la red de Compose
# la API usa los nombres de servicio (mysql, minio), así que DATABASE_URL y S3_ENDPOINT_URL
# del .env (pensados para ejecutar la API en el host) se sustituyen aquí.

x-app-env: &app-env
  DATABASE_URL: mysql+pymysql://${MYSQL_USER:?Falta MYSQL_USER}:${MYSQL_PASSWORD:?Falta MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:?Falta MYSQL_DATABASE}?charset=utf8mb4
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:?Falta MINIO_ROOT_USER}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Falta MINIO_ROOT_PASSWORD}
  S3_BUCKET: ${S3_BUCKET:-files}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_AUTO_CREATE_BUCKET: ${S3_AUTO_CREATE_BUCKET:-true}
  MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-104857600}
  ALLOWED_CONTENT_TYPES: ${ALLOWED_CONTENT_TYPES:-}
  MAX_FILENAME_LENGTH: ${MAX_FILENAME_LENGTH:-255}

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Falta MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      # Por TCP: durante la inicialización MySQL sólo escucha en el socket, así que esto
      # no da "sano" hasta que el servidor definitivo está listo.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  minio:
    # MinIO dejó de publicar imágenes en Docker Hub/Quay; pgsty/minio es una build comunitaria
    # del mismo servidor (mismas variables y consola). Se puede cambiar con MINIO_IMAGE.
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"       # API S3
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # consola web
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Aplica las migraciones de Alembic y termina.
  migrate:
    build: .
    image: file-storage-service:dev
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    image: file-storage-service:dev
    restart: unless-stopped
    environment: *app-env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  mysqldata:
  miniodata:
