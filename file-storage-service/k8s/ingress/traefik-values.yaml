# Valores de Helm para Traefik, el balanceador de entrada (Ingress controller).
# k3s se instaló con --disable traefik, así que se instala aparte:
#   helm repo add traefik https://traefik.github.io/charts
#   helm upgrade --install traefik traefik/traefik -n core -f k8s/ingress/traefik-values.yaml
#
# (ingress-nginx dejó de mantenerse en marzo de 2026; Traefik es el controlador que trae k3s.)

deployment:
  replicas: 2

# Sólo en los nodos de la aplicación (1-4), y cada réplica en un nodo distinto.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: nodo
              operator: In
              values: ["1", "2", "3", "4"]
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
        topologyKey: kubernetes.io/hostname

ingressClass:
  enabled: true
  isDefaultClass: true

providers:
  kubernetesIngress:
    enabled: true
  kubernetesCRD:
    enabled: true

# type LoadBalancer: el ServiceLB de k3s publica los puertos 80/443 en las IP de los nodos.
service:
  type: LoadBalancer

ports:
  web:
    port: 8000
    exposedPort: 80
  websecure:
    port: 8443
    exposedPort: 443

# Traefik v3 corta por defecto las peticiones que tardan más de 60 s en leerse:
# se amplía para permitir subidas grandes (MAX_UPLOAD_SIZE = 100 MiB) en redes lentas.
additionalArguments:
  - --entryPoints.web.transport.respondingTimeouts.readTimeout=600s
  - --entryPoints.websecure.transport.respondingTimeouts.readTimeout=600s

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi
