# Configuración secreta de la API. PLANTILLA: no subas aquí las claves reales.
#
# Los Secrets no se comparten entre namespaces, así que las credenciales se repiten aquí:
#   - usuario, clave y base de DATABASE_URL = MYSQL_USER, MYSQL_PASSWORD, MYSQL_DATABASE de mysql-secret
#   - S3_ACCESS_KEY / S3_SECRET_KEY         = MINIO_ROOT_USER / MINIO_ROOT_PASSWORD de minio-secret
apiVersion: v1
kind: Secret
metadata:
  name: api-secret
  namespace: core
  labels:
    app.kubernetes.io/name: file-storage-api
    app.kubernetes.io/part-of: file-storage-service
type: Opaque
stringData:
  DATABASE_URL: mysql+pymysql://files:cambia-esta-clave@mysql.storage.svc.cluster.local:3306/files?charset=utf8mb4
  S3_ACCESS_KEY: cambia-este-usuario
  S3_SECRET_KEY: cambia-esta-clave
