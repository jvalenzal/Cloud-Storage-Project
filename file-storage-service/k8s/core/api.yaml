# API FastAPI: 4 réplicas repartidas entre los nodos 1-4 (una por nodo cuando es posible).
apiVersion: v1
kind: Service
metadata:
  name: file-storage-api
  namespace: core
  labels:
    app.kubernetes.io/name: file-storage-api
    app.kubernetes.io/part-of: file-storage-service
spec:
  # Reparte las peticiones entre las réplicas listas. DNS: file-storage-api.core.svc.cluster.local
  selector:
    app.kubernetes.io/name: file-storage-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-storage-api
  namespace: core
  labels:
    app.kubernetes.io/name: file-storage-api
    app.kubernetes.io/part-of: file-storage-service
spec:
  replicas: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: file-storage-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: file-storage-api
        app.kubernetes.io/part-of: file-storage-service
    spec:
      # Si la imagen está en un registro privado, descomenta y crea el Secret "ghcr" (ver README).
      # imagePullSecrets:
      #   - name: ghcr
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nodo
                    operator: In
                    values: ["1", "2", "3", "4"]
      # Reparte las réplicas entre nodos; si uno cae, se reubican en los demás.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: file-storage-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api
          image: ghcr.io/78spicy/file-storage-service:1.0.0
          # Un proceso por pod: en Kubernetes se escala con réplicas, no con workers.
          command:
            - uvicorn
            - app.main:app
            - --host=0.0.0.0
            - --port=8000
            - --proxy-headers
            - --forwarded-allow-ips=*
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secret
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Las subidas se almacenan temporalmente en /tmp antes de enviarse a MinIO.
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
