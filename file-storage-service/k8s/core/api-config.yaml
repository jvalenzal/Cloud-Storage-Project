# Configuración no secreta de la API (variables de entorno).
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: core
  labels:
    app.kubernetes.io/name: file-storage-api
    app.kubernetes.io/part-of: file-storage-service
data:
  # MinIO dentro del clúster (namespace "storage")
  S3_ENDPOINT_URL: http://minio.storage.svc.cluster.local:9000
  S3_BUCKET: files
  S3_REGION: us-east-1
  S3_AUTO_CREATE_BUCKET: "true"
  # Reglas de validación
  MAX_UPLOAD_SIZE: "104857600"
  ALLOWED_CONTENT_TYPES: ""
  MAX_FILENAME_LENGTH: "255"
