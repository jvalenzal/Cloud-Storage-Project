# Credenciales de MySQL. PLANTILLA: no subas aquí las claves reales.
# Crea el Secret real con kubectl (ver README, "Despliegue en Kubernetes"), o edita una copia
# local de este archivo y aplícala sin añadirla al repositorio.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: storage
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/part-of: file-storage-service
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: cambia-esta-clave-de-root
  MYSQL_DATABASE: files
  MYSQL_USER: files
  MYSQL_PASSWORD: cambia-esta-clave
